name: Diagnose

on:
  push:
    branches:
      - diag/**

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: "*/go.sum"

      - name: Measure the host fast path
        env:
          OPT_REPO: https://github.com/ReneWerner87/fasthttp
          VARIANTS: "fast:perf/host-fast-path lazy:perf/lazy-request-time"
        run: diag/run.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diag
          path: |
            ${{ runner.temp }}/diag/*.txt
            ${{ runner.temp }}/diag/*.log
